[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "panorgan"
version = "2.0.0"
description = "Pan-Organ Net V2: Unified 2D/2.5D Multi-Modality Clinical Medical Imaging Foundation Framework"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "timm>=1.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "scikit-learn>=1.3.0",
    "Pillow>=10.0.0",
    "PyYAML>=6.0.0",
    "nibabel>=5.2.0",
    "pydicom>=2.4.0",
    "matplotlib>=3.8.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
colab = [
    "open-clip-torch>=2.24.0",
    "transformers>=4.40.0",
    "kaggle>=1.6.0",
    "huggingface-hub>=0.23.0",
    "scikit-image>=0.22.0",
]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["panorgan*"]

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PanOrgan Model Training Draft</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="reports_data.js?v=202611241030"></script>
  <style>
    :root {
      --text: #111827;
      --muted: #374151;
      --border: #cbd5e1;
      --surface: #f8fafc;
      --accent: #0f172a;
      --page-bg: #e2e8f0;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: "Times New Roman", Times, Georgia, serif;
      font-size: 10.5pt;
      line-height: 1.45;
      color: var(--text);
      background: var(--page-bg);
      -webkit-font-smoothing: antialiased;
    }

    body {
      padding: 20px 16px 48px 16px;
    }

    /* Screen-Only Navigation Toolbar */
    .toolbar {
      width: 210mm;
      max-width: 100%;
      margin: 0 auto 20px auto;
      padding: 10px 14px;
      background: #ffffff;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      font-family: "Times New Roman", Times, Georgia, serif;
    }

    .version-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: #f8fafc;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 5px 12px;
      font-family: "Times New Roman", Times, Georgia, serif;
      font-size: 10pt;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .tab-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .tab-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .page-count-badge {
      font-size: 9.5pt;
      font-weight: 700;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 4px 10px;
    }

    .print-btn {
      background: var(--accent);
      color: #ffffff;
      border: 1px solid var(--accent);
      padding: 5px 14px;
      font-family: "Times New Roman", Times, Georgia, serif;
      font-size: 10pt;
      font-weight: 700;
      cursor: pointer;
    }

    .print-btn:hover {
      opacity: 0.92;
    }

    /* Multi-Page Container */
    .document-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    /* Flat Standard A4 Page (No Border, No Rounded Corners) */
    .a4-page {
      width: 210mm;
      height: 297mm;
      min-height: 297mm;
      background: #ffffff;
      padding: 16mm 18mm 15mm 18mm;
      border: none;
      border-radius: 0;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.10);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .a4-page.tab-hidden {
      display: none;
    }

    .page-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Cover Page Styling */
    .cover-page .page-body {
      justify-content: space-between;
      padding: 4mm 0 2mm 0;
    }

    .cover-uni-block {
      text-align: center;
      border-bottom: 1.5px solid var(--accent);
      padding-bottom: 8px;
    }

    .cover-uni-name {
      font-size: 15pt;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .cover-dept-name {
      font-size: 11.5pt;
      font-weight: 700;
      color: var(--muted);
      margin-top: 2px;
    }

    .cover-course-line {
      font-size: 10pt;
      font-weight: 700;
      color: var(--muted);
      margin-top: 3px;
    }

    .cover-title-block {
      text-align: center;
      padding: 12px 8px;
      margin: 6px 0;
    }

    .cover-draft-badge {
      display: inline-block;
      font-size: 9.5pt;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
      border-top: 1px solid var(--accent);
      border-bottom: 1px solid var(--accent);
      padding: 3px 14px;
      margin-bottom: 12px;
    }

    .cover-main-title {
      font-size: 27pt;
      font-weight: 700;
      color: var(--accent);
      line-height: 1.18;
      margin: 0 0 12px 0;
      text-align: center;
    }

    .cover-project-title {
      font-size: 12.5pt;
      font-weight: 700;
      color: #1f2937;
      line-height: 1.4;
      max-width: 92%;
      margin: 0 auto 8px auto;
      text-align: center;
    }

    .cover-project-subtitle {
      font-size: 10pt;
      color: var(--muted);
      text-align: center;
      margin: 0;
    }

    .cover-section-label {
      font-size: 11pt;
      font-weight: 700;
      color: var(--accent);
      border-bottom: 1px solid var(--accent);
      padding-bottom: 2px;
      margin: 8px 0 6px 0;
    }

    /* Running Header (Pages 2+) */
    .running-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 8.5pt;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
      margin-bottom: 10px;
    }

    .running-header strong {
      color: var(--accent);
      font-weight: 700;
    }

    /* Running Footer (All Pages) */
    .page-footer {
      margin-top: 10px;
      padding-top: 5px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 8.8pt;
      color: var(--muted);
    }

    .page-footer strong {
      color: var(--accent);
      font-weight: 700;
    }

    /* Version First-Page Header */
    header.report-header {
      padding-bottom: 8px;
      margin-bottom: 10px;
      border-bottom: 1.5px solid var(--accent);
    }

    h1 {
      margin: 0 0 5px 0;
      font-size: 17pt;
      font-weight: 700;
      color: var(--accent);
      line-height: 1.2;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 9.2pt;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 4px 10px;
    }

    .meta-row strong {
      color: var(--text);
      font-weight: 700;
    }

    section {
      margin-bottom: 8px;
    }

    h2 {
      font-size: 11.5pt;
      font-weight: 700;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: 2px;
      margin: 8px 0 5px 0;
    }

    section:first-of-type h2 {
      margin-top: 2px;
    }

    h3 {
      font-size: 10pt;
      font-weight: 700;
      color: var(--accent);
      margin: 7px 0 4px 0;
    }

    p {
      margin: 0 0 5px 0;
      color: #1f2937;
      text-align: justify;
    }

    /* Tables */
    .table-wrap {
      border: 1px solid var(--border);
      margin: 4px 0 8px 0;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 8.8pt;
      line-height: 1.35;
      table-layout: auto;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }

    th, td {
      padding: 4.5px 8px;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--border);
    }

    th {
      background: var(--surface);
      font-weight: 700;
      color: var(--accent);
      font-size: 8.8pt;
    }

    td:first-child {
      font-weight: 700;
      color: var(--accent);
    }

    tr:last-child td {
      border-bottom: none;
    }

    tbody tr:nth-child(even) {
      background-color: #fcfcfd;
    }

    /* Diagrams & Figures */
    .diagram-box {
      border: 1px solid var(--border);
      background: #ffffff;
      padding: 6px 8px;
      margin: 4px 0 8px 0;
      text-align: center;
      overflow: hidden;
    }

    .diagram-box svg {
      max-width: 100% !important;
      max-height: 105px !important;
      height: auto !important;
    }

    .figure-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
      margin: 5px 0 8px 0;
    }

    .figure-card {
      border: 1px solid var(--border);
      background: #ffffff;
      padding: 6px 7px;
      margin: 0;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    .figure-card.full-span {
      grid-column: 1 / -1;
    }

    .figure-card img {
      max-width: 100%;
      max-height: 158px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      margin: 0 auto 4px auto;
    }

    .figure-card.full-span img {
      max-height: 165px;
    }

    .figure-caption {
      font-size: 8.2pt;
      font-weight: 700;
      color: var(--muted);
      line-height: 1.25;
    }

    .note-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      padding: 6px 10px;
      margin: 5px 0 8px 0;
      font-size: 8.9pt;
      color: #1f2937;
      text-align: justify;
    }

    /* Responsive fallback for smaller screens */
    @media screen and (max-width: 840px) {
      .a4-page {
        width: 100%;
        height: auto;
        min-height: auto;
        padding: 18px;
      }
      .figure-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Exact A4 Print: Prints ALL pages in continuous sequence */
    @page {
      size: A4 portrait;
      margin: 0;
    }

    @media print {
      html, body {
        width: 210mm !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .toolbar {
        display: none !important;
      }

      .document-container {
        display: block !important;
        margin: 0 !important;
        padding: 0 !important;
        gap: 0 !important;
      }

      .a4-page,
      .a4-page.tab-hidden {
        display: flex !important;
        width: 210mm !important;
        height: 297mm !important;
        min-height: 297mm !important;
        margin: 0 !important;
        padding: 16mm 18mm 15mm 18mm !important;
        border: none !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        page-break-after: always;
        break-after: page;
        page-break-inside: avoid;
        break-inside: avoid;
      }

      .a4-page:last-child {
        page-break-after: auto;
        break-after: auto;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="version-tabs" id="versionTabs"></div>
    <div class="toolbar-actions">
      <span class="page-count-badge" id="pageCountBadge">A4 Pages</span>
      <button class="print-btn" onclick="window.print()">Print All Pages (A4 PDF)</button>
    </div>
  </div>

  <main class="document-container" id="reportRoot"></main>

  <script>
    if (typeof mermaid !== "undefined") {
      mermaid.initialize({
        startOnLoad: false,
        theme: "base",
        themeVariables: {
          fontFamily: "'Times New Roman', Times, Georgia, serif",
          fontSize: "12px",
          lineColor: "#475569"
        },
        securityLevel: "loose"
      });
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function buildTable(headers, rows) {
      if (!rows || !rows.length) return "";
      const thead = "<thead><tr>" + headers.map(h => `<th>${escapeHtml(h)}</th>`).join("") + "</tr></thead>";
      const tbody = "<tbody>" + rows.map(r => "<tr>" + r.map(c => `<td>${escapeHtml(c)}</td>`).join("") + "</tr>").join("") + "</tbody>";
      return `<div class="table-wrap"><table>${thead}${tbody}</table></div>`;
    }

    function buildImageGrid(images) {
      if (!images || !images.length) return "";
      const isOdd = images.length % 2 === 1;
      const cards = images.map((img, idx) => {
        const spanClass = (isOdd && idx === images.length - 1) ? "figure-card full-span" : "figure-card";
        return `
          <div class="${spanClass}">
            <img src="${escapeHtml(img.src)}" alt="${escapeHtml(img.caption)}" />
            <div class="figure-caption">${escapeHtml(img.caption)}</div>
          </div>
        `;
      }).join("");
      return `<div class="figure-grid">${cards}</div>`;
    }

    function chunkArray(arr, size) {
      if (!arr || !arr.length) return [];
      const chunks = [];
      for (let i = 0; i < arr.length; i += size) {
        chunks.push(arr.slice(i, i + size));
      }
      return chunks;
    }

    function buildVersionPages(data) {
      const pages = [];
      const dsHeaders = data.datasetHeaders || ["Cohort", "Modality", "Samples", "Clinical Task"];
      const epHeaders = data.epochHeaders || ["Epoch", "Train Loss", "Val Loss", "Val Dice", "Val Macro-F1", "Val Accuracy"];
      const clsHeaders = data.classificationHeaders || ["Metric", "Uncalibrated", "Calibrated"];
      const hasMetricsTables = Boolean(data.epochRows || data.classificationRows || data.segmentationRows || data.conformalRows);
      const imageChunks = chunkArray(data.images || [], 6);
      const mermaidId = `mermaidGraph_${data.id.replace(".", "_")}`;

      // Page A: Overview & Architecture
      pages.push({
        sectionId: data.id,
        isVersionStart: true,
        data,
        html: `
          <section>
            <h2>1. Overview &amp; Objectives</h2>
            ${data.overview.map(p => `<p>${escapeHtml(p)}</p>`).join("")}
          </section>
          <section>
            <h2>2. Architecture &amp; Pipeline</h2>
            <div class="diagram-box">
              <div class="mermaid" id="${mermaidId}">${data.mermaid}</div>
            </div>
            ${buildTable(["Component", "Technical Role", "Implementation Status"], data.architectureRows)}
          </section>
        `
      });

      if (!hasMetricsTables) {
        // Version 1 Page B: Datasets + Training Note + Verification + Limitations
        pages.push({
          sectionId: data.id,
          isVersionStart: false,
          data,
          html: `
            <section>
              <h2>3. Datasets &amp; Zero-Leakage Splitting</h2>
              <p>${escapeHtml(data.datasetsNote)}</p>
              ${buildTable(dsHeaders, data.datasetRows)}
            </section>
            <section>
              <h2>4. Training &amp; Prototype Scope</h2>
              <p>${escapeHtml(data.trainingNote)}</p>
              <div class="note-box"><strong>Prototype Scope Note:</strong> ${escapeHtml(data.robustnessNote)}</div>
            </section>
            <section>
              <h2>5. Verification &amp; Audit Trail</h2>
              ${buildTable(["Verification Item", "Artifact / Source Path", "Verified Result"], data.verificationRows)}
            </section>
            <section>
              <h2>6. Known Drawbacks &amp; Next-Version Fixes</h2>
              ${buildTable(["Drawback / Limitation", "Resolution / Next Step"], data.limitations)}
            </section>
          `
        });

        // Version 1 Page C: Visual Prototype Figures
        if (imageChunks[0]) {
          pages.push({
            sectionId: data.id,
            isVersionStart: false,
            data,
            html: `
              <section>
                <h2>7. Visual Prototype &amp; Diagnostic Figures</h2>
                ${buildImageGrid(imageChunks[0])}
              </section>
            `
          });
        }
        return pages;
      }

      // Page B: Datasets & Zero-Leakage Splitting
      pages.push({
        sectionId: data.id,
        isVersionStart: false,
        data,
        html: `
          <section>
            <h2>3. Datasets &amp; Zero-Leakage Splitting</h2>
            <p>${escapeHtml(data.datasetsNote)}</p>
            ${buildTable(dsHeaders, data.datasetRows)}
          </section>
        `
      });

      // Page C: Training Progression & Classification/Calibration
      pages.push({
        sectionId: data.id,
        isVersionStart: false,
        data,
        html: `
          <section>
            <h2>4. Training &amp; Calibration Progression</h2>
            <p>${escapeHtml(data.trainingNote)}</p>
            ${data.epochRows ? buildTable(epHeaders, data.epochRows) : ""}
          </section>
          <section>
            <h2>5. Quantitative Evaluation Metrics</h2>
            ${data.classificationRows ? `<h3>5.1 Classification &amp; Calibration Performance</h3>${buildTable(clsHeaders, data.classificationRows)}` : ""}
          </section>
        `
      });

      // Page D: Segmentation, Conformal Prediction & Robustness Summary
      pages.push({
        sectionId: data.id,
        isVersionStart: false,
        data,
        html: `
          <section>
            <h2>5. Quantitative Evaluation Metrics (Continued)</h2>
            ${data.segmentationRows ? `<h3>5.2 Anatomical &amp; Lesion Segmentation (Mean &amp; 95% Bootstrap CI)</h3>${buildTable(["Cohort", "Samples", "Dice (95% CI)", "IoU", "HD95 (mm)"], data.segmentationRows)}` : ""}
            ${data.conformalRows ? `<h3>5.3 MC2 Conformal Prediction Coverage (alpha = 0.10)</h3>${buildTable(["Cohort", "Test n", "Marginal Coverage", "Avg Set Size", "Abstention Rate"], data.conformalRows)}` : ""}
            <div class="note-box"><strong>Robustness &amp; Calibration Summary:</strong> ${escapeHtml(data.robustnessNote)}</div>
          </section>
        `
      });

      // Page E+: Visual Figures + Verification & Limitations
      if (imageChunks.length === 1) {
        pages.push({
          sectionId: data.id,
          isVersionStart: false,
          data,
          html: `
            <section>
              <h2>6. Visual Evaluation &amp; Diagnostic Plots</h2>
              ${buildImageGrid(imageChunks[0])}
            </section>
          `
        });
        pages.push({
          sectionId: data.id,
          isVersionStart: false,
          data,
          html: `
            <section>
              <h2>7. Verification &amp; Audit Trail</h2>
              ${buildTable(["Verification Item", "Artifact / Source Path", "Verified Result"], data.verificationRows)}
            </section>
            <section>
              <h2>8. Known Drawbacks &amp; Next-Version Fixes</h2>
              ${buildTable(["Drawback / Limitation", "Resolution / Next Step"], data.limitations)}
            </section>
          `
        });
      } else if (imageChunks.length > 1) {
        // First 6 figures on Page E
        pages.push({
          sectionId: data.id,
          isVersionStart: false,
          data,
          html: `
            <section>
              <h2>6. Visual Evaluation &amp; Diagnostic Plots (Part 1)</h2>
              ${buildImageGrid(imageChunks[0])}
            </section>
          `
        });

        // Remaining figures: if <= 3, combine with Verification & Limitations; if 4+, split cleanly
        if (imageChunks[1].length <= 3) {
          pages.push({
            sectionId: data.id,
            isVersionStart: false,
            data,
            html: `
              <section>
                <h2>6. Visual Evaluation &amp; Cohort Analytics (Part 2)</h2>
                ${buildImageGrid(imageChunks[1])}
              </section>
              <section>
                <h2>7. Verification &amp; Audit Trail</h2>
                ${buildTable(["Verification Item", "Artifact / Source Path", "Verified Result"], data.verificationRows)}
              </section>
              <section>
                <h2>8. Known Drawbacks &amp; Next-Version Fixes</h2>
                ${buildTable(["Drawback / Limitation", "Resolution / Next Step"], data.limitations)}
              </section>
            `
          });
        } else {
          pages.push({
            sectionId: data.id,
            isVersionStart: false,
            data,
            html: `
              <section>
                <h2>6. Visual Evaluation &amp; Cohort Analytics (Part 2)</h2>
                ${buildImageGrid(imageChunks[1])}
              </section>
            `
          });
          pages.push({
            sectionId: data.id,
            isVersionStart: false,
            data,
            html: `
              <section>
                <h2>7. Verification &amp; Audit Trail</h2>
                ${buildTable(["Verification Item", "Artifact / Source Path", "Verified Result"], data.verificationRows)}
              </section>
              <section>
                <h2>8. Known Drawbacks &amp; Next-Version Fixes</h2>
                ${buildTable(["Drawback / Limitation", "Resolution / Next Step"], data.limitations)}
              </section>
            `
          });
        }
      }

      return pages;
    }

    function buildCoverPageHtml(tocRows, totalPages) {
      const teamTable = buildTable(
        ["Member", "Name", "Student ID", "Department & Institution"],
        [
          ["1st Member", "MD. Shoaib Khan", "0242310005101484", "Dept. of CSE, Daffodil International University"],
          ["2nd Member", "Asmita Rahman", "0242310005101412", "Dept. of CSE, Daffodil International University"]
        ]
      );

      const supervisorTable = buildTable(
        ["Role", "Name", "Designation", "Department & Institution"],
        [
          ["Supervisor", "Dr. Md. Ali Hossain", "Associate Professor", "Dept. of CSE, Daffodil International University"],
          ["Co-Supervisor", "Mayen Uddin Mojumder", "Assistant Professor", "Dept. of CSE, Daffodil International University"]
        ]
      );

      const tocTable = buildTable(
        ["Section / Version", "Stage & Scope", "Status", "Pages"],
        tocRows
      );

      return `
        <article class="a4-page cover-page" data-section="cover">
          <div class="page-body">
            <div class="cover-uni-block">
              <div class="cover-uni-name">Daffodil International University</div>
              <div class="cover-dept-name">Department of Computer Science and Engineering</div>
              <div class="cover-course-line">Course Code: CSE499 &nbsp;|&nbsp; Title: Final Year Design Project (FYDP) &nbsp;|&nbsp; Semester: Spring 2026</div>
            </div>

            <div class="cover-title-block">
              <div class="cover-draft-badge">Technical Research &amp; Evaluation Draft</div>
              <h1 class="cover-main-title">PanOrgan Model Training Draft</h1>
              <p class="cover-project-title">The Pan-Organ Diagnostic Paradigm: A High-Capacity Foundation Model for Multi-Modality Medical Screening (Pan-Organ Net)</p>
              <p class="cover-project-subtitle">Unified Multi-Modal Architecture, Patient-Level Zero-Leakage Evaluation, Conformal Calibration, and Complete Version Progression (PanOrgan 1 &ndash; PanOrgan 4)</p>
            </div>

            <div>
              <div class="cover-section-label">Group Members</div>
              ${teamTable}
              <div class="cover-section-label">Supervision</div>
              ${supervisorTable}
              <div class="cover-section-label">Document Contents &amp; Continuous Page Index</div>
              ${tocTable}
            </div>
          </div>

          <footer class="page-footer">
            <span><strong>PanOrgan Model Training Draft</strong> &mdash; Daffodil International University (CSE499)</span>
            <span><strong>Page 1 of ${totalPages}</strong></span>
          </footer>
        </article>
      `;
    }

    function wrapVersionPage(pageObj, pageNum, totalPages) {
      const { data, isVersionStart, html, sectionId } = pageObj;
      const topHeader = isVersionStart ? `
        <header class="report-header">
          <h1>${escapeHtml(data.title)} &mdash; ${escapeHtml(data.subtitle)}</h1>
          <div class="meta-row">
            <span><strong>Stage:</strong> ${escapeHtml(data.stage)}</span>
            <span><strong>Scope:</strong> ${escapeHtml(data.scope)}</span>
            <span><strong>Status:</strong> ${escapeHtml(data.status)}</span>
          </div>
        </header>
      ` : `
        <div class="running-header">
          <span><strong>${escapeHtml(data.title)}</strong> &mdash; ${escapeHtml(data.subtitle)}</span>
          <span><strong>${escapeHtml(data.stage)}</strong></span>
        </div>
      `;

      return `
        <article class="a4-page" data-section="${escapeHtml(sectionId)}">
          <div class="page-body">
            ${topHeader}
            ${html}
          </div>
          <footer class="page-footer">
            <span><strong>PanOrgan Model Training Draft</strong> &mdash; ${escapeHtml(data.title)}</span>
            <span><strong>Page ${pageNum} of ${totalPages}</strong></span>
          </footer>
        </article>
      `;
    }

    function selectTab(tabId) {
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.tab === tabId);
      });

      const pages = document.querySelectorAll(".a4-page");
      let visibleCount = 0;
      pages.forEach(page => {
        const show = (tabId === "all") || (page.dataset.section === tabId);
        page.classList.toggle("tab-hidden", !show);
        if (show) visibleCount++;
      });

      const total = pages.length;
      const badge = document.getElementById("pageCountBadge");
      badge.textContent = tabId === "all"
        ? `All ${total} A4 Pages`
        : `${visibleCount} of ${total} A4 Pages`;

      const url = new URL(window.location.href);
      url.searchParams.set("v", tabId);
      window.history.replaceState({}, "", url.toString());
    }

    async function renderFullDraft() {
      const versionIds = ["1", "2", "3", "3.1", "3.2", "4"];
      const allVersionPages = [];
      const tocRows = [["Cover & Team Info", "Title, Team Members, Supervisor & Index", "Completed", "Page 1"]];

      let runningPage = 2; // Page 1 is the Cover Page
      for (const vId of versionIds) {
        const data = window.PANORGAN_REPORTS[vId];
        if (!data) continue;
        const vPages = buildVersionPages(data);
        const startPage = runningPage;
        const endPage = runningPage + vPages.length - 1;
        tocRows.push([
          `${data.title}`,
          `${data.stage} — ${data.scope}`,
          data.status,
          startPage === endPage ? `Page ${startPage}` : `Pages ${startPage}–${endPage}`
        ]);
        vPages.forEach(p => allVersionPages.push(p));
        runningPage = endPage + 1;
      }

      const totalPages = 1 + allVersionPages.length;
      const coverHtml = buildCoverPageHtml(tocRows, totalPages);
      const bodyHtml = allVersionPages
        .map((p, idx) => wrapVersionPage(p, idx + 2, totalPages))
        .join("");

      const root = document.getElementById("reportRoot");
      root.innerHTML = coverHtml + bodyHtml;

      if (typeof mermaid !== "undefined") {
        try {
          const nodes = Array.from(document.querySelectorAll(".mermaid"));
          if (nodes.length) {
            await mermaid.run({ nodes });
          }
        } catch (err) {
          console.error("Mermaid render error:", err);
        }
      }

      const params = new URLSearchParams(window.location.search);
      const validTabs = ["cover", ...versionIds, "all"];
      const initial = validTabs.includes(params.get("v")) ? params.get("v") : "cover";
      selectTab(initial);
    }

    (function init() {
      const tabs = document.getElementById("versionTabs");
      const tabDefs = [
        { id: "cover", label: "Cover" },
        { id: "1", label: "PanOrgan 1" },
        { id: "2", label: "PanOrgan 2" },
        { id: "3", label: "PanOrgan 3" },
        { id: "3.1", label: "PanOrgan 3.1" },
        { id: "3.2", label: "PanOrgan 3.2" },
        { id: "4", label: "PanOrgan 4" },
        { id: "all", label: "All Pages" }
      ];

      tabDefs.forEach(t => {
        const btn = document.createElement("button");
        btn.className = "tab-btn";
        btn.dataset.tab = t.id;
        btn.textContent = t.label;
        btn.onclick = () => selectTab(t.id);
        tabs.appendChild(btn);
      });

      renderFullDraft();
    })();
  </script>
</body>
</html>

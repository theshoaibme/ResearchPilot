<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PanOrgan Technical Report</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="reports_data.js?v=202611240949"></script>
  <style>
    :root {
      --text: #111827;
      --muted: #4b5563;
      --border: #d1d5db;
      --surface: #f8fafc;
      --accent: #0f172a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 28px 20px;
      font-family: "Times New Roman", Times, Georgia, serif;
      font-size: 14.5px;
      line-height: 1.6;
      color: var(--text);
      background: #f3f4f6;
      -webkit-font-smoothing: antialiased;
    }

    .toolbar {
      max-width: 820px;
      margin: 0 auto 16px auto;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
    }

    .version-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: #ffffff;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 9999px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .print-btn {
      background: #ffffff;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
    }

    .page {
      max-width: 820px;
      margin: 0 auto;
      background: #ffffff;
      padding: 46px 50px;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    header {
      padding-bottom: 14px;
      margin-bottom: 20px;
      border-bottom: 1.5px solid var(--accent);
    }

    h1 {
      margin: 0 0 4px 0;
      font-size: 24px;
      font-weight: 700;
      color: var(--accent);
    }

    .subtitle {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      font-size: 12.5px;
      color: var(--muted);
    }

    .meta-row strong {
      color: var(--text);
      font-weight: 700;
    }

    h2 {
      font-size: 15.5px;
      font-weight: 700;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: 3px;
      margin: 22px 0 10px 0;
      page-break-after: avoid;
      break-after: avoid;
    }

    h3 {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text);
      margin: 12px 0 6px 0;
      page-break-after: avoid;
      break-after: avoid;
    }

    p { margin: 0 0 9px 0; color: #1f2937; text-align: justify; }
    ol { margin: 6px 0 12px 0; padding-left: 18px; color: #1f2937; }
    li { margin-bottom: 5px; }

    .table-wrap {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin: 10px 0 14px 0;
      page-break-inside: avoid;
      break-inside: avoid;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 12.5px;
      table-layout: auto;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }

    th, td {
      padding: 7px 10px;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--border);
    }

    td:first-child { font-weight: 700; color: var(--accent); }
    tr:last-child td { border-bottom: none; }

    th {
      background: var(--surface);
      font-weight: 700;
      color: var(--accent);
      font-size: 12.5px;
    }

    .figure-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin: 10px 0 14px 0;
    }

    .diagram-box, .figure-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #ffffff;
      padding: 10px;
      margin: 0;
      text-align: center;
      overflow-x: auto;
      page-break-inside: avoid;
      break-inside: avoid;
    }

    .diagram-box {
      margin: 10px 0 14px 0;
    }

    .figure-card img {
      max-width: 100%;
      max-height: 240px;
      width: auto;
      height: auto;
      border-radius: 6px;
      display: block;
      margin: 0 auto 6px auto;
    }

    .figure-caption {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
    }

    .note-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      margin: 10px 0;
      font-size: 12.5px;
      color: #1f2937;
      page-break-inside: avoid;
      break-inside: avoid;
    }

    .diagram-box svg {
      max-width: 100%;
      height: auto;
    }

    @page {
      size: A4 portrait;
      margin: 18mm 16mm 18mm 16mm;
    }

    @media print {
      html, body {
        width: auto !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        font-family: "Times New Roman", Times, Georgia, serif;
        font-size: 10pt;
        line-height: 1.48;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .toolbar { display: none !important; }
      .page {
        width: auto !important;
        max-width: 100% !important;
        border: none !important;
        border-radius: 0 !important;
        padding: 0 !important;
        margin: 0 !important;
        box-shadow: none !important;
      }
      header {
        margin-top: 0 !important;
        padding-top: 0 !important;
        break-inside: avoid;
        page-break-inside: avoid;
      }
      table {
        width: 100% !important;
        font-size: 9.2pt;
      }
      th, td {
        padding: 5px 8px;
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      .diagram-box {
        padding: 8px;
        overflow: hidden !important;
      }
      .diagram-box svg {
        max-width: 100% !important;
        width: 100% !important;
        height: auto !important;
      }
      .figure-grid {
        gap: 8px;
        break-inside: auto;
      }
      .figure-card, .diagram-box, .table-wrap, .note-box, tr {
        break-inside: avoid;
        page-break-inside: avoid;
        max-width: 100%;
      }
      .figure-card img {
        max-height: 170px;
        max-width: 100%;
        object-fit: contain;
      }
      section { break-inside: auto; }
      h1, h2, h3 {
        break-after: avoid;
        page-break-after: avoid;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="version-tabs" id="versionTabs"></div>
    <button class="print-btn" onclick="window.print()">Print / Save PDF</button>
  </div>

  <main class="page" id="reportRoot"></main>

  <script>
    if (typeof mermaid !== "undefined") {
      mermaid.initialize({
        startOnLoad: false,
        theme: "base",
        themeVariables: {
          fontFamily: "'Times New Roman', Times, Georgia, serif",
          fontSize: "13px",
          lineColor: "#64748b"
        },
        securityLevel: "loose"
      });
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function buildTable(headers, rows) {
      if (!rows || !rows.length) return "";
      const thead = "<thead><tr>" + headers.map(h => `<th>${escapeHtml(h)}</th>`).join("") + "</tr></thead>";
      const tbody = "<tbody>" + rows.map(r => "<tr>" + r.map(c => `<td>${escapeHtml(c)}</td>`).join("") + "</tr>").join("") + "</tbody>";
      return `<div class="table-wrap"><table>${thead}${tbody}</table></div>`;
    }

    function buildSvgBars(cfg) {
      if (!cfg) return "";
      const maxVal = cfg.maxVal || 1.0;
      const barH = 22;
      const gap = 10;
      const labelW = 190;
      const chartW = 430;
      const valW = 70;
      const height = cfg.items.length * (barH + gap) + 10;
      const rows = cfg.items.map((item, idx) => {
        const y = idx * (barH + gap) + 6;
        const w = Math.max(4, Math.round((item.value / maxVal) * chartW));
        const valText = cfg.isCount ? item.value.toLocaleString() : item.value.toFixed(4);
        return `
          <text x="${labelW - 10}" y="${y + 15}" text-anchor="end" font-size="12" fill="#374151">${escapeHtml(item.label)}</text>
          <rect x="${labelW}" y="${y}" width="${chartW}" height="${barH}" rx="6" fill="#f3f4f6" />
          <rect x="${labelW}" y="${y}" width="${w}" height="${barH}" rx="6" fill="${item.color}" />
          <text x="${labelW + chartW + 10}" y="${y + 15}" font-size="12" font-weight="600" fill="#111827">${valText}</text>
        `;
      }).join("");
      return `
        <div class="figure-card">
          <svg viewBox="0 0 ${labelW + chartW + valW} ${height}" width="100%" style="max-width:690px;display:block;margin:0 auto;">
            ${rows}
          </svg>
          <div class="figure-caption">${escapeHtml(cfg.title)}</div>
        </div>
      `;
    }

    function buildImages(images) {
      if (!images || !images.length) return "";
      const cards = images.map(img => `
        <div class="figure-card">
          <img src="${escapeHtml(img.src)}" alt="${escapeHtml(img.caption)}" />
          <div class="figure-caption">${escapeHtml(img.caption)}</div>
        </div>
      `).join("");
      return `<div class="figure-grid">${cards}</div>`;
    }

    async function renderVersion(versionId) {
      const data = window.PANORGAN_REPORTS[versionId] || window.PANORGAN_REPORTS["1"];
      document.title = `${data.title} — ${data.subtitle}`;

      const url = new URL(window.location.href);
      url.searchParams.set("v", data.id);
      window.history.replaceState({}, "", url.toString());

      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.version === data.id);
      });

      const root = document.getElementById("reportRoot");
      root.innerHTML = `
        <header>
          <h1>${escapeHtml(data.title)}</h1>
          <div class="subtitle">${escapeHtml(data.subtitle)}</div>
          <div class="meta-row">
            <span><strong>Stage:</strong> ${escapeHtml(data.stage)}</span>
            <span><strong>Scope:</strong> ${escapeHtml(data.scope)}</span>
            <span><strong>Status:</strong> ${escapeHtml(data.status)}</span>
          </div>
        </header>

        <section>
          <h2>1. Overview &amp; Objectives</h2>
          ${data.overview.map(p => `<p>${escapeHtml(p)}</p>`).join("")}
        </section>

        <section>
          <h2>2. Architecture &amp; Pipeline</h2>
          <div class="diagram-box">
            <div class="mermaid" id="mermaidGraph">${data.mermaid}</div>
          </div>
          ${buildTable(["Component", "Technical Role", "Status"], data.architectureRows)}
        </section>

        <section>
          <h2>3. Datasets &amp; Splitting</h2>
          <p>${escapeHtml(data.datasetsNote)}</p>
          ${buildTable(["Cohort", "Modality", "Samples", "Task"], data.datasetRows)}
        </section>

        <section>
          <h2>4. Training &amp; Calibration</h2>
          <p>${escapeHtml(data.trainingNote)}</p>
          ${data.epochRows ? buildTable(["Epoch", "Train Loss", "Val Loss", "Val Dice", "Val Macro-F1", "Val Accuracy"], data.epochRows) : ""}
        </section>

        <section>
          <h2>5. Evaluation Metrics &amp; Visuals</h2>
          ${data.classificationRows ? `<h3>Classification &amp; Calibration</h3>${buildTable(["Metric", "Uncalibrated", "Calibrated"], data.classificationRows)}` : ""}
          ${data.segmentationRows ? `<h3>Segmentation (Mean &amp; 95% CI)</h3>${buildTable(["Cohort", "Samples", "Dice (95% CI)", "IoU", "HD95 (mm)"], data.segmentationRows)}` : ""}
          ${data.conformalRows ? `<h3>MC2 Conformal Coverage (alpha = 0.10)</h3>${buildTable(["Cohort", "Test n", "Coverage", "Avg Set Size", "Abstention Rate"], data.conformalRows)}` : ""}
          ${buildImages(data.images)}
          ${buildSvgBars(data.svgBars)}
          <div class="note-box">${escapeHtml(data.robustnessNote)}</div>
        </section>

        <section>
          <h2>6. Verification &amp; Audit Trail</h2>
          ${buildTable(["Verification Item", "Artifact / Source Path", "Verified Result"], data.verificationRows)}
        </section>

        <section>
          <h2>7. Known Drawbacks &amp; Next-Version Fixes</h2>
          ${buildTable(["Drawback / Limitation", "Resolution / Next Step"], data.limitations)}
        </section>
      `;

      if (typeof mermaid !== "undefined") {
        try {
          await mermaid.run({ nodes: [document.getElementById("mermaidGraph")] });
        } catch (err) {
          console.error("Mermaid render error:", err);
        }
      }
    }

    (function init() {
      const tabs = document.getElementById("versionTabs");
      ["1", "2", "3", "3.1", "3.2"].forEach(v => {
        const btn = document.createElement("button");
        btn.className = "tab-btn";
        btn.dataset.version = v;
        btn.textContent = `PanOrgan ${v}`;
        btn.onclick = () => renderVersion(v);
        tabs.appendChild(btn);
      });

      const params = new URLSearchParams(window.location.search);
      const initial = params.get("v") && window.PANORGAN_REPORTS[params.get("v")] ? params.get("v") : "1";
      renderVersion(initial);
    })();
  </script>
</body>
</html>
